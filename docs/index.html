<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sudoku Solver (WASM)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Sudoku Solver (WASM)</h1>

    <p>セルをクリックして選択し、キーボードで <strong>1–9</strong> を入力、<strong>Esc</strong> でクリアできます。</p>

    <!-- デフォルトパズル（非表示）: 初期値読み取り用 -->
    <textarea id="puzzle" hidden>..3.2.6..
9..3.5..1
..18.64..
..81.29..
7.......8
..67.82..
..26.95..
8..2.3..9
..5.1.3..</textarea>

    <div id="grid" aria-label="Sudoku grid" role="grid"></div>

    <div class="controls">
      <button id="solve">Solve</button>
      <button id="revert" disabled>Revert</button>
      <button id="clear">Clear</button>
      <span id="status"></span>
    </div>

    <h2>結果</h2>
    <pre id="result">—</pre>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
