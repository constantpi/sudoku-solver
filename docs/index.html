<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sudoku Solver (Wasm)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Sudoku Solver (Wasm)</h1>

    <p>操作方法:
      <br>・PC：セルをクリックして選択し、キーボードで <strong>1–9</strong> を入力できます。矢印キーで隣のセルに移動できます。<br>
      ・スマホ／タッチ端末：セルをタップして選択し、画面下部のボタンから番号（1〜9）を選ぶか、消去ボタン（⌫）でクリアしてください。
    </p>

    <!-- デフォルトパズル（非表示）: 初期値読み取り用 -->
    <textarea id="puzzle" hidden>000000046
000000000
001230000
002007000
003000500
000405090
000010300
400006000
900000000</textarea>

    <div id="grid" aria-label="Sudoku grid" role="grid"></div>

    <div class="controls">
      <button id="solve">Solve</button>
      <button id="revert" disabled>Revert</button>
      <button id="clear">Clear</button>
      <span id="status"></span>
    </div>

    <h2>結果</h2>
    <pre id="result">—</pre>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
